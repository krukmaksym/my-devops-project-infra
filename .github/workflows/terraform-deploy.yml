name: Terraform Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      resource:
        description: 'Resource to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - network
          - kubernetes
          - monitoring

env:
  TERRAFORM_VERSION: '1.14.0'
  TERRAGRUNT_VERSION: '0.93.11'
  TARGET_ENV: ${{ inputs.environment || 'dev' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Branch Constraints
        run: |
          TARGET_ENV="${{ env.TARGET_ENV }}"
          BRANCH="${{ github.ref_name }}"
          
          echo "Target Environment: $TARGET_ENV"
          echo "Current Branch: $BRANCH"
          
          if [ "$TARGET_ENV" == "prod" ] && [ "$BRANCH" != "main" ]; then
            echo "❌ Error: Production can only be deployed from 'main' branch."
            exit 1
          fi
          
          echo "✅ Branch check passed."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Install Doppler
        run: |
          (curl -Ls https://cli.doppler.com/install.sh || wget -qO- https://cli.doppler.com/install.sh) | sudo sh
          
      - name: Deploy Infrastructure
        run: |
          echo "🚀 Deploying to $TARGET_ENV..."
          
          # Use Makefile for consistency
          # The Makefile uses 'doppler run' internally, so we need to provide the token
          export DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN }}
          
          # Ensure TF Cloud token is available as env var for Terragrunt
          export TF_VAR_tf_cloud_token=${{ secrets.TF_CLOUD_TOKEN }}
          # Set the Terraform CLI Cloud Token
          export TF_TOKEN_app_terraform_io=${{ secrets.TF_CLOUD_TOKEN }}
          export TG_NON_INTERACTIVE=true
          
          RESOURCE="${{ inputs.resource || 'all' }}"
          echo "Target Resource: $RESOURCE"
          
          if [ "$RESOURCE" == "all" ]; then
            cd infra/terraform/live/${TARGET_ENV}
            # Note: terragrunt run --all handles auto-approval automatically in non-interactive mode.
            # Adding -auto-approve explicitly causes a "flag provided but not defined" error.
            CMD="run --all apply"
          else
             # Check if directory exists
            if [ ! -d "infra/terraform/live/${TARGET_ENV}/${RESOURCE}" ]; then
              echo "❌ Error: Resource directory 'infra/terraform/live/${TARGET_ENV}/${RESOURCE}' does not exist."
              exit 1
            fi
            cd infra/terraform/live/${TARGET_ENV}/${RESOURCE}
            CMD="apply -auto-approve"
          fi
          
          echo "Executing: terragrunt $CMD"

          doppler run --name-transformer tf-var -- \
            terragrunt $CMD
