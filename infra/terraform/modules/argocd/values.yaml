global:
  tolerations:
    - key: "service"
      operator: "Equal"
      value: "monitoring"
      effect: "NoSchedule"
  nodeSelector:
    service: monitoring

server:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/do-loadbalancer-name: "argocd-${environment}"
%{ if length(lb_source_ranges) > 0 ~}
    loadBalancerSourceRanges:
%{ for cidr in lb_source_ranges ~}
      - "${cidr}"
%{ endfor ~}
%{ endif ~}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

redisSecretInit:
  tolerations:
    - key: "service"
      operator: "Equal"
      value: "monitoring"
      effect: "NoSchedule"
  nodeSelector:
    service: monitoring

dex:
  enabled: ${dex_enabled}
%{ if dex_enabled ~}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
%{ endif ~}

notifications:
  enabled: false

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

configs:
  params:
    server.insecure: "${server_insecure}"
%{ if dex_enabled ~}
    # Required so ArgoCD redirects OAuth callbacks correctly
    server.dex.server: "http://argocd-dex-server:5556"
%{ endif ~}
  cm:
    admin.enabled: "${admin_enabled}"
%{ if argocd_url != "" ~}
    url: "${argocd_url}"
%{ endif ~}
%{ if dex_enabled ~}
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: ${github_oauth_client_id}
            clientSecret: $dex.github.clientSecret
%{ if github_org != "" ~}
            orgs:
              - name: ${github_org}
%{ endif ~}
%{ endif ~}
  rbac:
    policy.default: role:readonly
%{ if github_org != "" ~}
    policy.csv: |
      g, ${github_org}:${github_admin_team != "" ? github_admin_team : "*"}, role:admin
%{ endif ~}
    scopes: "[groups]"
