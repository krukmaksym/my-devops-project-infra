name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
          - all
      resource:
        description: 'Resource to destroy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - network
          - kubernetes
          - argocd
      confirmation:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

env:
  TERRAFORM_VERSION: '1.14.0'
  TERRAGRUNT_VERSION: '0.93.11'

jobs:
  destroy:
    name: Destroy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "❌ Error: Confirmation text does not match 'DESTROY'. Aborting."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Install Doppler
        run: |
          (curl -Ls https://cli.doppler.com/install.sh || wget -qO- https://cli.doppler.com/install.sh) | sudo sh

      - name: Strip ArgoCD Application Finalizers
        continue-on-error: true
        run: |
          RESOURCE="${{ inputs.resource || 'all' }}"
          TARGET_ENV="${{ inputs.environment }}"

          # Only needed when argocd resources are being destroyed
          if [ "$RESOURCE" == "network" ] || [ "$RESOURCE" == "kubernetes" ]; then
            echo "Skipping finalizer cleanup (resource=$RESOURCE)"
            exit 0
          fi

          export DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN }}
          export TF_TOKEN_app_terraform_io=${{ secrets.TF_CLOUD_TOKEN }}
          export TG_NON_INTERACTIVE=true

          strip_argocd_finalizers() {
            local env=$1
            local k8s_dir="infra/terraform/live/${env}/kubernetes"

            echo "→ Getting kubeconfig for ${env}..."
            KUBECONFIG_FILE=$(mktemp /tmp/kubeconfig-XXXXXX)
            ERR_FILE=$(mktemp /tmp/kubeconfig-err-XXXXXX)
            trap 'rm -f "${KUBECONFIG_FILE}" "${ERR_FILE}"' RETURN

            (cd "${k8s_dir}" && doppler run --name-transformer tf-var -- \
              terragrunt output -raw kubeconfig) > "${KUBECONFIG_FILE}" 2>"${ERR_FILE}" || true

            if [ ! -s "${KUBECONFIG_FILE}" ]; then
              echo "  No kubeconfig for ${env} — terragrunt output said:"
              cat "${ERR_FILE}" || true
              return
            fi

            echo "→ Stripping finalizers from ArgoCD Applications in ${env}..."
            kubectl --kubeconfig="${KUBECONFIG_FILE}" get applications.argoproj.io \
              -A --no-headers -o custom-columns="NS:.metadata.namespace,NAME:.metadata.name" 2>/dev/null | \
            while read -r ns name; do
              [ -z "$name" ] && continue
              echo "  Patching ${ns}/${name}"
              kubectl --kubeconfig="${KUBECONFIG_FILE}" patch application.argoproj.io "${name}" \
                -n "${ns}" --type=merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
            done

            echo "  Done for ${env}"
          }

          if [ "$TARGET_ENV" == "all" ]; then
            for env in dev stage prod; do
              strip_argocd_finalizers "$env" || echo "⚠️  Finalizer cleanup failed for ${env} — destroy may be slower"
            done
          else
            strip_argocd_finalizers "$TARGET_ENV" || echo "⚠️  Finalizer cleanup failed for ${TARGET_ENV} — destroy may be slower"
          fi

      - name: Destroy Infrastructure
        run: |
          TARGET_ENV="${{ inputs.environment }}"
          echo "💥 Destroying $TARGET_ENV..."
          
          export DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN }}
          export TF_VAR_tf_cloud_token=${{ secrets.TF_CLOUD_TOKEN }}
          
          # Set the Terraform CLI Cloud Token
          export TF_TOKEN_app_terraform_io=${{ secrets.TF_CLOUD_TOKEN }}
          
          export TG_NON_INTERACTIVE=true
          
          RESOURCE="${{ inputs.resource || 'all' }}"
          echo "Target Resource: $RESOURCE"
          
          if [ "$TARGET_ENV" == "all" ]; then
             if [ "$RESOURCE" != "all" ]; then
                echo "❌ Error: Cannot select specific resource when Destruction Environment is 'all'."
                exit 1
             fi
             cd infra/terraform/live
              # Note: terragrunt run --all handles auto-approval automatically in non-interactive mode.
              # Dynamically include all directories EXCEPT 'network' to avoid "Cannot delete default VPC" error.
              # This ensures new modules are strictly included without manual updates, while network is skipped.
              # Added --queue-strict-include to prevent Terragrunt from implicitly including dependencies like 'network'.
              INCLUDES=$(find . -maxdepth 1 -mindepth 1 -type d -not -name 'network' -not -name '.*' -exec basename {} \; | awk '{print "--queue-include-dir " $1}' | tr '\n' ' ')
              echo "Dynamic Includes: $INCLUDES"
              CMD="run --all --queue-strict-include $INCLUDES destroy"
            else
              if [ "$RESOURCE" == "all" ]; then
                cd infra/terraform/live/${TARGET_ENV}
                # Note: terragrunt run --all handles auto-approval automatically in non-interactive mode.
                # Dynamically include all directories EXCEPT 'network'
                # Added --queue-strict-include to prevent Terragrunt from implicitly including dependencies like 'network'.
                INCLUDES=$(find . -maxdepth 1 -mindepth 1 -type d -not -name 'network' -not -name '.*' -exec basename {} \; | awk '{print "--queue-include-dir " $1}' | tr '\n' ' ')
                echo "Dynamic Includes: $INCLUDES"
                CMD="run --all --queue-strict-include $INCLUDES destroy"
              else
               # Check if directory exists
              if [ ! -d "infra/terraform/live/${TARGET_ENV}/${RESOURCE}" ]; then
                echo "❌ Error: Resource directory 'infra/terraform/live/${TARGET_ENV}/${RESOURCE}' does not exist."
                exit 1
              fi
              cd infra/terraform/live/${TARGET_ENV}/${RESOURCE}
              CMD="destroy -auto-approve"
            fi
          fi
          
          echo "Executing: terragrunt $CMD"
          
          doppler run --name-transformer tf-var -- \
            terragrunt $CMD
