# This workflow runs a Gemini-powered code review on pull requests when a specific comment is made.
name: Gemini Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@gemini-cli')
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if PR is from fork
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_REPO=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRepositoryOwner,headRepository --jq '.headRepositoryOwner.login + "/" + .headRepository.name')
          if [ "$HEAD_REPO" == "${{ github.repository }}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ PR is from a fork - skipping Gemini review for security"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  gemini-code-review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    needs: security-gate
    if: needs.security-gate.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Gemini Review & Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Get PR metadata
          PR_JSON=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json baseRefName)
          BASE_BRANCH=$(echo "$PR_JSON" | jq -r .baseRefName)
          
          # 2. Ensure base branch is available for diffing
          git fetch origin "$BASE_BRANCH" --depth=1
          
          # 3. Generate the diff and store it
          git diff origin/"$BASE_BRANCH"...HEAD > pr_diff.patch
          
          # 4. Run Gemini review using the locally checked out instructions
          # Avoid bash quoting issues and exit failures by piping the context directly and adding || true
          cat GEMINI.md pr_diff.patch | npx -y @google/gemini-cli@latest \
            --yolo \
            --model "gemini-flash-lite-latest" \
            --prompt "Review this pull request carefully and strictly follow the project-specific guardrails and instructions provided. The piped input contains the GEMINI.md guardrails followed by the code diff." \
            --output-format text > review_output.md || true
          
          # 5. Post the comment if the output is not empty
          if [ -s review_output.md ]; then
            gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file review_output.md
          else
            echo "::warning::Gemini produced an empty review output."
          fi
