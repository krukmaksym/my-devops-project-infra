global:
  tolerations:
    - key: "service"
      operator: "Equal"
      value: "monitoring"
      effect: "NoSchedule"
  nodeSelector:
    service: monitoring

server:
  service:
    type: LoadBalancer
%{ if length(lb_source_ranges) > 0 ~}
    loadBalancerSourceRanges:
%{ for cidr in lb_source_ranges ~}
      - "${cidr}"
%{ endfor ~}
%{ endif ~}

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

configs:
  params:
    # DEV ONLY: disable TLS on the ArgoCD server so the DO LoadBalancer
    # handles plain HTTP. Do NOT use in stage/prod — configure TLS
    # termination at the LB or use an ingress with cert-manager instead.
    server.insecure: true
  cm:
    # TODO: disable default admin and configure OIDC before stage/prod
    admin.enabled: "true"
