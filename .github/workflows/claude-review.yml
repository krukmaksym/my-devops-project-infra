name: Claude Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if PR is from fork
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_REPO=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRepositoryOwner,headRepository --jq '.headRepositoryOwner.login + "/" + .headRepository.name')
          if [ "$HEAD_REPO" == "${{ github.repository }}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ PR is from a fork - skipping Claude review for security"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  claude-code-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    needs: security-gate
    if: needs.security-gate.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Review this pull request carefully and strictly follow the project-specific guardrails and instructions provided in the repository's CLAUDE.md file."
          use_sticky_comment: true
          claude_args: "--allowedTools Bash(gh *),Read,Glob,Grep"
